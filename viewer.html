<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Visionneur 360° — ODD Inc.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #viewer { width: 100%; height: 100%; }
    #logo { position: absolute; bottom: 50px; right: 50px; z-index: 50; }
    #logo img { height: 160px; width: auto; }
    .home-link { position: absolute; top: 16px; left: 16px; z-index: 60; font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .home-link a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.45); }
    .home-link a:hover { background: rgba(0,0,0,.65); }
    .banner {
      position: absolute; top: 0; left: 0; right: 0;
      background: #b91c1c; color: #fff; padding: 10px 14px;
      font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: none; z-index: 80;
    }
    .banner.show { display: block; }
  </style>
</head>
<body>
  <div class="home-link"><a href="index.html" aria-label="Retour à l'accueil">← Accueil</a></div>
  <div id="logo">
    <a href="https://loeildudrone.ca" target="_blank" rel="noopener">
      <img src="logo_sans_fond_blanc2.PNG" alt="ODD">
    </a>
  </div>
  <div id="viewer" role="application" aria-label="Visionneur panoramique 360"></div>
  <div id="banner" class="banner" role="alert"></div>

  <script>
    (function () {
      const banner = document.getElementById('banner');
      function showError(msg) {
        banner.textContent = msg;
        banner.classList.add('show');
        console.error(msg);
      }

      if (!window.pannellum) {
        showError("Erreur: bibliothèque Pannellum introuvable. Vérifiez la connexion Internet et le CDN.");
        return;
      }

      function getSceneFromQuery() {
        const p = new URLSearchParams(window.location.search);
        const s = p.get('scene');
        return s && /^scene(\d+)$/.test(s) ? s : 'scene1';
      }

      const scenes = {
        "scene1": { title: "1 Éolienne, Cabane Rouillé et Champs de moutarde", panorama: "QQWJ6677.JPG" },
        "scene2": { title: "2 Sainte-Brigide au matin", panorama: "djiflypano.jpg" },
        "scene3": { title: "3 Église de Sainte-Julie à première vue", panorama: "eglise3604.JPG" },
        "scene4": { title: "4 Voie ferrée à Boucherville", panorama: "Chemin de fer Boucherville.JPG" },
        "scene5": { title: "5 abords des îles de Boucherville ", panorama: "360Idb.JPG" },
        "scene6": { title: "VERREAULT TRANSPORT au dessus de la 400 pieds.", panorama: "NKHI4430.JPG" },
        "scene7": { title: "au dessus d'un champs d'une Ferme.", panorama: "AVGJ0991.JPG" },
        "scene8": { title: "Vue 360 au dessus des abords du fleuve St-Laurent.", panorama: "ANVB2332.JPG" },
        "scene9": { title: "Près du Fleuve à Longueuil ", panorama: "DJI_0412.JPG" },
        "scene10": { title: "Transition d'un site à l'autre - Montréal ;) ", panorama: "DJI_0426.JPG" },
        "scene11": { title: "Vieux port et illumination du centre-ville de Montréal", panorama: "DJI_0444.JPG" },
        "scene12": { title: "rue Saint-Antoine dans le vieux port de Montréal", panorama: "DJI_0456.JPG" }
      };

      const initialScene = getSceneFromQuery();
      if (!scenes[initialScene]) {
        showError("Scène inconnue: " + initialScene);
        return;
      }

      // Pannellum config
      const config = {
        "default": {
          firstScene: initialScene,
          sceneFadeDuration: 1000,
          autoLoad: true
        },
        scenes: {}
      };

      for (const [key, val] of Object.entries(scenes)) {
        config.scenes[key] = {
          title: val.title,
          panorama: val.panorama,
          type: "equirectangular"
        };
      }

      try {
        const viewer = pannellum.viewer('viewer', config);

        // Handle back/forward
        window.addEventListener('popstate', function() {
          const s = getSceneFromQuery();
          if (scenes[s] && viewer.getScene() !== s) viewer.loadScene(s);
        });

      } catch (e) {
        showError("Erreur lors de l'initialisation du visionneur: " + e.message);
      }
    })();
  </script>
</body>
</html>
