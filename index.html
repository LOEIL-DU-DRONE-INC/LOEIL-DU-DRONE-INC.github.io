<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Visionneur 360° - L'Œil du Drone inc.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

  
    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr; /* barre en haut (mobile) + viewer */
    }


    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .controls a {
      font: 600 16px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 10px 14px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 12px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .controls a:hover { background: rgba(255,255,255,0.2); }
    .controls a:focus { outline: 3px solid rgba(255,255,255,0.45); outline-offset: 2px; }

    
    @media (min-width: 768px){
      .app {
        grid-template-rows: 1fr;
      }
      .controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        top: auto;
        transform: translateX(-50%);
        border: none;
        border-radius: 16px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0));
      }
    }


    #logo {
      position: fixed;
      bottom: 50px;
      right: 50px;
      z-index: 30;
    }
    #logo img { height: 200px; max-width: 40vw; object-fit: contain; }

    .viewer-wrap, .viewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="app">
   
    <nav class="controls" aria-label="Choisir une vue">
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene1" target="viewer">Vue 1</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene2" target="viewer">Vue 2</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene3" target="viewer">Vue 3</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene4" target="viewer">Vue 4</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene5" target="viewer">Vue 5</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene6" target="viewer">Vue 6</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene7" target="viewer">Vue 7</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene8" target="viewer">Vue 8</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene9" target="viewer">Vue 9</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene10" target="viewer">Vue 10</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene11" target="viewer">Vue 11</a>
      <a href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene12" target="viewer">Vue 12</a>
    </nav>

   
    <div class="viewer-wrap">
      <iframe
        class="viewer"
        name="viewer"
        src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.htm?config=tour.json&scene=scene1"
        allow="vr; xr; accelerometer; gyroscope; fullscreen"
        title="Visionneur 360°">
      </iframe>
    </div>
  </div>

  <div id="logo">
    <a href="https://loeildudrone.ca" target="_blank" rel="noopener">
      <img src="logo_sans_fond_blanc2.PNG" alt="L’Œil du Drone inc.">
    </a>
  </div>
