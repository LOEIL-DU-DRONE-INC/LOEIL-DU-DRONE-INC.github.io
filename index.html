<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visionneur 360° - L'Œil du Drone inc.</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    #viewer {
      width: 100%;
      height: 100%;
    }
    #logo {
      position: absolute;
      bottom: 50px;
      right: 50px;
      z-index: 50;
    }
    #logo img {
      height: 200px;
    }
  
 .controls{
  position: absolute;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 20;              
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.35); 
  backdrop-filter: blur(6px);
  border-radius: 16px;
}


.scene-btn{
  font: 600 18px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  padding: 12px 18px;           
  min-width: 84px;              
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 12px;
  cursor: pointer;
}
.scene-btn:hover{ background: rgba(255,255,255,0.2); }
.scene-btn:focus{ outline: 3px solid rgba(255,255,255,0.45); outline-offset: 2px; }

@media (max-width: 640px){
  .scene-btn{ font-size: 16px; padding: 11px 16px; }
}

  </style>
</head>
<body>
  <div id="logo">
    <a href="https://loeildudrone.ca" target="_blank">
      <img src="logo_sans_fond_blanc2.PNG" alt="ODD">
    </a>
  </div>
<!-- Barre de commandes -->
<div class="controls">
  <button class="scene-btn" onclick="viewer.loadScene('scene1')">Vue 1</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene2')">Vue 2</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene3')">Vue 3</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene4')">Vue 4</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene5')">Vue 5</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene6')">Vue 6</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene7')">Vue 7</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene8')">Vue 8</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene9')">Vue 9</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene10')">Vue 10</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene11')">Vue 11</button>
  <button class="scene-btn" onclick="viewer.loadScene('scene12')">Vue 12</button>
</div>

  <div id="viewer"></div>

  <!-- Include pannellum.js for 360 viewing -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>

  <script>
    var viewer = pannellum.viewer('viewer', {
  "default": {
    "firstScene": "scene1",
    "sceneFadeDuration": 1000
  },
  "scenes": {
    "scene1": {
      "title": "1 Éolienne, Cabane Rouillé et Champs de moutarde",
      "panorama": "QQWJ6677.JPG"
    },
    "scene2": {
      "title": "2 Sainte-Brigide au matin",
      "panorama": "djiflypano.jpg"
    },
    "scene3": {
      "title": "3 Église de Sainte-Julie à première vue",
      "panorama": "eglise3604.JPG"
    },
    "scene4": {
      "title": "4 Voie ferrée à Boucherville",
      "panorama": "Chemin de fer Boucherville.JPG"
    },
     "scene5": {
      "title": "5 abords des îles de Boucherville ",
      "panorama": "360Idb.JPG"
    },
    "scene6": {
      "title": "VERREAULT TRANSPORT au dessus de la 400 pieds.",
      "panorama": "NKHI4430.JPG"
    },
     "scene7": {
      "title": "au dessus d'un champs d'une Ferme.",
      "panorama": "AVGJ0991.JPG"
    },
     "scene8": {
      "title": "Vue 360 au dessus des abors du fleuve St-Laurent.",
      "panorama": "ANVB2332.JPG"
    },
    "scene9": {
      "title": "Fête pour Grand-Maman Marthe",
      "panorama": "party360.JPG"
    },
    "scene10": {
      "title": "En famille",
      "panorama": "party361.JPG"
    },
    "scene11": {
        "title": "Varenne en début de soirée",
        "panorama": "Var1.JPG"
      },
    "scene12": {
      "title": "Varenne en soirée",
      "panorama": "Var2.JPG"
    }
  }
});
  </script>
</body>
</html>
