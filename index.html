<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visionneur 360° - L'Œil du Drone inc.</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }
    #viewer {
      width: 100%;
      height: 100%;
    }
    #logo {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 10;
    }
    #logo img {
      height: 100px;
    }
  </style>
</head>
<body>
  <div id="logo">
    <a href="https://loeildudrone.ca" target="_blank">
      <img src="logo_sans_fond_blanc2.PNG" alt="ODD">
    </a>
  </div>
  <button onclick="viewer.loadScene('scène1')">Vue 1</button>
  <button onclick="viewer.loadScene('scène2')">Vue 2</button>
  <button onclick="viewer.loadScene('scène3')">Vue 3</button>
  <button onclick="viewer.loadScene('scène4')">Vue 4</button>
  <button onclick="viewer.loadScene('scène5')">Vue 5</button>
  <button onclick="viewer.loadScene('scène6')">Vue 6</button>
  <button onclick="viewer.loadScene('scène7')">Vue 7</button>
  <button onclick="viewer.loadScene('scène8')">Vue 8</button>
  <div id="viewer"></div>

  <!-- Include pannellum.js for 360 viewing -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>

  <script>
    
    var viewer = pannellum.viewer('viewer', {

  "default": {
    "firstScene": "randomScene",
    "sceneFadeDuration": 1000
  },
  "scenes": {
    "scène1": {
      "title": "Un bout de champ à Boucherville",
      "panorama": "BouChamp.JPG"
    },
    "scène2": {
      "title": "2 Sainte-Brigide au matin",
      "panorama": "djiflypano.jpg"
    },
     "scène3": {
      "title": "3 Sainte-Brigide Sous les nuages",
      "panorama": "dji_fly_pano.jpg"
    },
    "scène4": {
      "title": "4 Église de Sainte-Julie Coté Presbitaire",
      "panorama": "eglise3601.JPG"
    },
    "scène5": {
      "title": "5 Église de Sainte-Julie vu du pignon",
      "panorama": "eglise3602.JPG"
    },
    "scène6": {
      "title": "6 Église de Sainte-Julie Altitude Croix",
      "panorama": "eglise3603.JPG"
    },
    "scène7": {
      "title": "7 Église de Sainte-Julie à première vue",
      "panorama": "eglise3604.JPG"
    },
     "scène8": {
      "title": "1 Éolienne, Cabane Rouillé et Champs de moutarde",
      "panorama": "QQWJ6677.JPG"
  }
});
  </script>
</body>
</html>
